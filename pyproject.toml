[project]
name = "outrage"
version = "0.1.0"
description = "Online implementation of Outrage! Steal the Crown Jewels"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server", "server.net", "server.game"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
